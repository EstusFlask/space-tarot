<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星空塔罗｜Space Tarot</title>
    <script>
      (() => {
        const storageKey = 'tarot-theme-mode';
        let themeMode = 'system';

        try {
          const storedTheme = localStorage.getItem(storageKey);
          if (storedTheme === 'dark' || storedTheme === 'light' || storedTheme === 'system') {
            themeMode = storedTheme;
          }
        } catch {
          // Keep following the system when storage is unavailable.
        }

        const resolvedTheme = themeMode === 'system'
          ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : themeMode;
        const root = document.documentElement;
        root.classList.add(`theme-${resolvedTheme}`);
        root.classList.toggle('dark', resolvedTheme === 'dark');
        root.dataset.themeMode = themeMode;
        root.style.colorScheme = resolvedTheme;
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body class="bg-[#0f131f] text-[#dfe2f3] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
